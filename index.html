<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday My Love</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gingham">

  <div class="page-container">
    <div class="floating-header">
      <div class="progress-pill">Page 1 / 10</div>
    </div>

    <!-- Main Card -->
    <div class="scrapbook-card envelope-cover" onclick="openCard()">
      <div class="scallop-frame">
        <h1 class="cursive-title hero">Happy Birthday</h1>
        <h2 class="cursive-title sub">My Love</h2>
        <div style="margin-top: 25px;">
          <a href="letter.html" class="btn-vintage primary" onclick="event.stopPropagation();">
            Open Your Card ✨
          </a>
        </div>
      </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
      <div class="nav-dots">
        <a href="index.html" class="nav-dot active" title="Page 1"></a>
        <a href="letter.html" class="nav-dot" title="Page 2"></a>
        <a href="surprise.html" class="nav-dot" title="Page 3"></a>
        <a href="question.html" class="nav-dot" title="Page 4"></a>
        <a href="yay.html" class="nav-dot" title="Page 5"></a>
        <a href="gifts.html" class="nav-dot" title="Page 6"></a>
        <a href="scrapbook.html" class="nav-dot" title="Page 7"></a>
        <a href="flowers.html" class="nav-dot" title="Page 8"></a>
        <a href="memories.html" class="nav-dot" title="Page 9"></a>
        <a href="song.html" class="nav-dot" title="Page 10"></a>
      </div>
      <a href="letter.html" class="nav-link">Next →</a>
    </div>
  </div>

  <script src="js/music.js"></script>
  <script src="js/seamless.js"></script>
  <script>
    function openCard() {
      if (window.BdayMusic) window.BdayMusic.play();
      if (window.navigateToPage) {
        window.navigateToPage('letter.html');
      } else {
        window.location.href = 'letter.html';
      }
    }
  </script>
</body>
</html>
