<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You're So Handsome Just Like This Song</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-split">

  <div class="page-container">
    <div class="floating-header">
      <div class="progress-pill">Page 9 / 10</div>
    </div>

    <div class="scrapbook-card" style="background: transparent; box-shadow: none;">
      <div class="memories-scene">
        
        <!-- Left: Note & Vinyl Record -->
        <div class="turntable-card" style="max-width: 260px;">
          <div style="background: #fffdf9; border: 1.5px dashed #b92b3b; border-radius: 6px; padding: 18px; margin-bottom: 20px; box-shadow: 0 8px 18px rgba(0,0,0,0.3);">
            <h3 class="cursive-title" style="font-size: 1.8rem; margin-bottom: 6px;">Dear, My Love,</h3>
            <p class="handwritten-text" style="font-size: 1.35rem; line-height: 1.4; color: #42181d;">
              You're So Beautiful Just Like This Song.
            </p>
            <div style="margin-top: 10px; border-top: 1px dashed #c49d80; padding-top: 6px;">
              <span class="typewriter-text" style="font-size: 0.8rem; color: #8b1524;">I love you, forever and always</span>
            </div>
          </div>

          <div class="vinyl-large" title="Click to spin vinyl!" onclick="if(window.BdayMusic) window.BdayMusic.toggle();"></div>
        </div>

        <!-- Center: Samsung Digicam & Our Photo -->
        <div style="display: flex; flex-direction: column; align-items: center; max-width: 280px;">
          <div class="polaroid" style="position: static; margin-bottom: -15px; width: 175px; z-index: 2;">
            <img src="assets/ourPictures/photo7.jpeg" alt="Our sweet photo" style="height: 125px; object-fit: cover;">
          </div>
          <img src="assets/stickers/samsung_camera.png" alt="Samsung Digicam" style="width: 210px; z-index: 3; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.4));">
        </div>

        <!-- Right: Photo Booth Film Strip with Our Pictures -->
        <div class="film-strip">
          <div class="film-frame">
            <img src="assets/ourPictures/photo8.jpeg" alt="Our moment 1">
          </div>
          <div class="film-frame">
            <img src="assets/ourPictures/photo9.jpeg" alt="Our moment 2">
          </div>
          <div class="film-frame">
            <img src="assets/ourPictures/photo10.jpeg" alt="Our moment 3">
          </div>
          <div class="film-frame">
            <img src="assets/ourPictures/photo11.jpeg" alt="Our moment 4">
          </div>
        </div>

      </div>

      <div style="margin-top: 35px;">
        <a href="song.html" class="btn-vintage primary">
          The Song That Reminds Me Of You →
        </a>
      </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
      <a href="flowers.html" class="nav-link">← Back</a>
      <div class="nav-dots">

        <a href="scrapbook.html" class="nav-dot" title="Page 7"></a>
        <a href="flowers.html" class="nav-dot" title="Page 8"></a>
        <a href="memories.html" class="nav-dot active" title="Page 9"></a>
        <a href="song.html" class="nav-dot" title="Page 10"></a>
      </div>
      <a href="song.html" class="nav-link">Next →</a>
    </div>
  </div>

  <script src="js/music.js"></script>
